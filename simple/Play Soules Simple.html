<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soules Simple · V25.12</title>
<style>
:root{--accent:#a9d9b2;--bg:#0c1511;--panel:#15221c;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e6efe8;font:17px/1.6 Consolas,monospace}header{padding:16px 24px;border-bottom:1px solid #395344;display:flex;gap:20px;align-items:center;justify-content:space-between}header small{color:var(--accent)}button,input,select{font:inherit;color:inherit;background:var(--panel);border:1px solid #4c6a57;border-radius:6px;padding:10px 14px}button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent);background:#2a4032}button:disabled{opacity:.45;cursor:default}nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px}main{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px;padding:0 24px 24px;max-width:1500px;margin:auto}article,aside section{background:var(--panel);border:1px solid #304c3a;border-radius:8px;padding:20px}aside{align-self:start;position:sticky;top:12px}aside section{margin-bottom:12px}h1,h2,h3{color:var(--accent);line-height:1.3}h1{font-size:23px;margin:0}h2{font-size:22px}h3{font-size:18px}#journal{max-height:360px;overflow:auto;border-bottom:1px solid #395344;padding-bottom:12px;margin-bottom:18px}#journal p{margin:8px 0}#choices{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}#detail{overflow-wrap:anywhere}#detail p{margin:10px 0}progress{width:100%;accent-color:var(--accent)}label{display:block;margin:12px 0}small,.muted{color:#abbcac}#message{color:#ffd49c;min-height:1.6em}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #395344;padding:8px}#new-game{max-width:480px}input{max-width:100%}footer{padding:0 24px 16px;color:#abbcac;font-size:13px}@media(max-width:850px){main{grid-template-columns:1fr}aside{position:static}header{flex-wrap:wrap}nav,main{padding-left:12px;padding-right:12px}}
</style></head><body>
<header><h1>SOULES <small>Simple</small></h1><span>V25.12 · Laptop edition · Offline</span><label>Colour <select id="theme"><option value="region">Follow region</option><option value="green">Forest</option><option value="purple">Purple</option><option value="blue">Blue</option></select></label></header>
<nav id="nav" aria-label="Game sections"></nav><main><article><div id="journal" role="log" aria-label="Adventure text"></div><p id="message" role="status"></p><h2 id="heading"></h2><div id="detail"></div><div id="choices"></div></article><aside id="sidebar" aria-label="Character status"></aside></main>
<footer>A new, deliberately smaller edition inspired by early Soules. Separate saves from the full game. No Python, server or Internet needed. Keep this HTML file and your exported saves.</footer><input id="import" type="file" accept=".json,application/json" hidden>
<script id="world-data" type="application/json">{"regions": [{"name": "Whispering Woods", "boss": "The Verdant King", "monsters": ["Thorn Wolf", "Root Stalker"], "village": "Old Village"}, {"name": "Ashen Wastes", "boss": "Ember Tyrant", "monsters": ["Ash Lizard", "Dust Scavenger"], "village": "Scorched Village"}, {"name": "Crimson Depths", "boss": "Crimson Furnace", "monsters": ["Forge Warden", "Molten Automaton"], "village": "Smiths' Quarter"}, {"name": "Frostbound Tundra", "boss": "Frost Monarch", "monsters": ["Ice Stag", "Snow Ripper"], "village": "Ice Hamlet"}, {"name": "Crystal Spire", "boss": "Crystal Sovereign", "monsters": ["Shard Pixie", "Prism Serpent"], "village": "Crystal Village"}, {"name": "Sunken Coast", "boss": "Kraken Sovereign", "monsters": ["Tide Eel", "Barnacle Beast"], "village": "Dockside Village"}, {"name": "Ironpeak Mountains", "boss": "Titan of Peaks", "monsters": ["Stone Ram", "Cliff Prowler"], "village": "Mountain Village"}, {"name": "Blight Swamp", "boss": "The Rotfather", "monsters": ["Rot Leech", "Mire Crawler"], "village": "Rotwood Village"}, {"name": "Shattered Wastes", "boss": "The Shard Overlord", "monsters": ["Shard Crawler", "Fracture Golem"], "village": "Shard Outpost"}, {"name": "Shadow Vale", "boss": "Void Emperor", "monsters": ["Shade Wolf", "Night Stalker"], "village": "Shadow Hamlet"}, {"name": "Infernal Depths", "boss": "Lord of Infernos", "monsters": ["Lava Serpent", "Ash Demon"], "village": "Ember Village"}, {"name": "Celestial Expanse", "boss": "The Celestial Arbiter", "monsters": ["Star Wisp", "Astral Hawk"], "village": "Starfall Village"}, {"name": "Riftlands", "boss": "The Rift Sovereign", "monsters": ["Rift Hound", "Anomaly Spawn"], "village": "Rift Outpost"}, {"name": "Abyss of Souls", "boss": "The Soul Devourer Supreme", "monsters": ["Soul Drifter", "Void Wraith"], "village": "Lost Village"}, {"name": "The Dreamscape", "boss": "The Dreaming God", "monsters": ["Dream Phantom", "Nightmare Wraith"], "village": "Lucid Village"}], "runes": ["Flame Rune", "Water Rune", "Earth Rune", "Nature Rune"]}</script>
<script>
'use strict';
const WORLD=JSON.parse(document.getElementById('world-data').textContent);
const $=id=>document.getElementById(id), KEY='soules-simple-1', MAX_LOG=65;
let g=null, screen='play', storageOK=true;
const clone=x=>JSON.parse(JSON.stringify(x));
function read(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}}
function store(key,value){try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,JSON.stringify(value))}catch{storageOK=false}}
function valid(s){
 if(!s||s.edition!=='soules-simple'||s.version!==1)throw Error('Choose a Soules Simple save. Full-game saves belong in the full game.');
 const ints={region:14,unlocked:14,level:1000,xp:1000000,hp:100000,maxHp:100000,gold:10000000,kills:1000000,wood:100000,metal:100000,cores:100000,potions:100000,turn:1000000,equipped:999};
 for(const [k,max]of Object.entries(ints))if(!Number.isInteger(s[k])||s[k]<0||s[k]>max)throw Error('Invalid save statistics.');
 if(s.level<1||s.maxHp!==90+(s.level-1)*12||s.hp<1||s.hp>s.maxHp||s.region>s.unlocked||typeof s.name!=='string'||s.name.length>24||!['normal','easy'].includes(s.difficulty))throw Error('Invalid character.');
 if(!Array.isArray(s.log)||s.log.length>MAX_LOG||s.log.some(t=>typeof t!=='string'||t.length>1000))throw Error('Invalid journal.');
 if(!Array.isArray(s.bosses)||s.bosses.length>15||new Set(s.bosses).size!==s.bosses.length||s.bosses.some(i=>!Number.isInteger(i)||i<0||i>14))throw Error('Invalid bosses.');
 if(!Array.isArray(s.weapons)||!s.weapons.length||s.weapons.length>1000||s.equipped>=s.weapons.length||s.weapons.some(w=>!w||typeof w.name!=='string'||w.name.length>100||!Number.isInteger(w.atk)||w.atk<0||w.atk>1000||(w.rune!==null&&!WORLD.runes.includes(w.rune))))throw Error('Invalid equipment.');
 if(!Array.isArray(s.runes)||s.runes.length>1000||s.runes.some(r=>!WORLD.runes.includes(r)))throw Error('Invalid runes.');
 if(s.enemy!==null){const e=s.enemy;if(!e||typeof e.name!=='string'||e.name.length>100||typeof e.boss!=='boolean'||['hp','maxHp','atk','burn'].some(k=>!Number.isInteger(e[k])||e[k]<0||e[k]>100000)||e.hp<1||e.hp>e.maxHp)throw Error('Invalid encounter.');}
 return clone(Object.fromEntries(['edition','version','name','difficulty','region','unlocked','level','xp','hp','maxHp','gold','kills','wood','metal','cores','potions','turn','equipped','log','bosses','weapons','runes','enemy'].map(k=>[k,s[k]])));
}
try{const saved=read(KEY);if(saved)g=valid(saved)}catch{storageOK=false}
function say(text){g.log.push(text);g.log=g.log.slice(-MAX_LOG)}
function notice(text){$('message').textContent=text}
function button(text,fn,parent=$('choices'),disabled=false){const b=document.createElement('button');b.textContent=text;b.disabled=disabled;b.onclick=()=>{notice('');try{fn()}catch(e){notice(e.message)}};parent.append(b);return b}
function line(text,parent=$('detail')){const p=document.createElement('p');p.textContent=text;parent.append(p);return p}
function title(text){$('heading').textContent=text}
function weapon(){return g.weapons[g.equipped]}
function attackStat(){return 7+(g.level-1)*2+weapon().atk}
function defence(){return 2+Math.floor((g.level-1)*1.5)+(weapon().rune==='Earth Rune'?4:0)}
function draw(){
 $('nav').replaceChildren();for(const [id,name]of [['play','Adventure'],['bag','Inventory / Equip'],['village','Village'],['map','Travel'],['dictionary','Dictionary'],['help','Tutorial'],['saves','Saves']])button(name,()=>{screen=id;draw()},$('nav'),!g&&!['dictionary','help','saves'].includes(id));
 $('journal').replaceChildren();for(const t of g?.log||['Welcome back to the simpler roads of Soules.'])line(t,$('journal'));
 $('detail').replaceChildren();$('choices').replaceChildren();$('sidebar').replaceChildren();
 const palettes=['#a9d9b2','#dbbc99','#ffb5a3','#afdcff','#d2bdff','#a3e0ed'];const themes={green:'#a9d9b2',purple:'#d2bdff',blue:'#afdcff'};
 document.documentElement.style.setProperty('--accent',themes[$('theme').value]||palettes[(g?.region||0)%palettes.length]);
 if(g){
  const s=document.createElement('section');$('sidebar').append(s);const h=document.createElement('h3');h.textContent=g.name;s.append(h);
  line(`Level ${g.level} · ${g.difficulty}`,s);line(WORLD.regions[g.region].name,s);line(`HP ${g.hp} / ${g.maxHp}`,s);const hp=document.createElement('progress');hp.max=g.maxHp;hp.value=g.hp;s.append(hp);
  line(`XP ${g.xp} / ${g.level*35}`,s);line(`ATK ${attackStat()} · DEF ${defence()}`,s);line(`Gold ${g.gold} · Potions ${g.potions}`,s);line(`Weapon: ${weapon().name}${weapon().rune?' · '+weapon().rune:''}`,s);line(`Guardians ${g.bosses.length} / 15 · Kills ${g.kills}`,s);
  if(g.enemy){const e=document.createElement('section');$('sidebar').append(e);line(`${g.enemy.name} · HP ${g.enemy.hp}/${g.enemy.maxHp}`,e);line(`Attack ${g.enemy.atk} · Burning ${g.enemy.burn} turns`,e);}
  store(KEY,g);
 }
 if(!g&&!['dictionary','help','saves'].includes(screen)){newForm();return}
 ({play:adventure,bag:inventory,village:town,map:travel,dictionary,help,saves}[screen]||adventure)();
 if(!storageOK)notice('Browser storage is unavailable or a save could not be restored. Export a backup from Saves before closing.');
}
function newForm(){title('Begin a simpler adventure');const form=document.createElement('form');form.id='new-game';form.innerHTML='<label>Your name <input name="name" maxlength="24" value="Wanderer" required></label><label>Difficulty <select name="difficulty"><option value="normal">Normal</option><option value="easy">Easy</option></select></label><button>Begin adventure</button>';
 form.onsubmit=e=>{e.preventDefault();const f=new FormData(form);g={edition:'soules-simple',version:1,name:String(f.get('name')).trim().slice(0,24)||'Wanderer',difficulty:f.get('difficulty'),region:0,unlocked:0,level:1,xp:0,hp:90,maxHp:90,gold:0,kills:0,wood:0,metal:0,cores:0,potions:0,turn:0,equipped:0,log:[],bosses:[],weapons:[{name:'Rusty Sword',atk:3,rune:null}],runes:[],enemy:null};say('You arrive in Old Village with only a Rusty Sword.');say('Elian: The Dreamscape was once separate. Its king corrupted the source, and the monsters returned. Free the regions and defeat him.');screen='village';draw()};$('detail').append(form);
}
function adventure(){title(g.enemy?'Combat':'Adventure');if(g.enemy){line(`${g.enemy.name} blocks your path. Choose your next move.`);button('Attack',()=>strike());button('Defend',()=>{say('You brace behind your sword.');enemyTurn(true);finish()});button(`Drink potion (${g.potions})`,drink,$('choices'),!g.potions);button('Run (65% chance)',()=>{if(g.enemy.boss){notice('You must face this guardian.');return}if(Math.random()<.65){say('You escape.');g.enemy=null}else{say('Your escape is blocked.');enemyTurn()}finish()},$('choices'),g.enemy.boss);return}
 line(g.bosses.includes(14)?'The Dreaming God is defeated. The world is safe, but Elian wonders who reopened the rift… Your simple adventure is complete; you can still explore.':'Travel, gather materials, forge stronger swords and defeat each region’s guardian.');
 button('Wander',wander);button('Gather wood & metal',()=>{g.turn++;g.wood++;g.metal++;say('You gather 1 wood and 1 metal for the village smith.');finish()});button('Challenge guardian',()=>encounter(true),$('choices'),g.bosses.includes(g.region));button('Return to village',()=>{screen='village';draw()});
}
function encounter(boss=false){if(boss&&g.bosses.includes(g.region)){notice('This guardian has already been defeated.');return}const r=WORLD.regions[g.region], names=r.monsters, stage=Math.floor((g.level-1)/5);let hp=(boss?75:25)+g.region*(boss?20:8)+stage*8, atk=(boss?13:8)+g.region*2+stage*2;if(g.difficulty==='easy'){hp=Math.ceil(hp*.75);atk=Math.ceil(atk*.6)}g.enemy={name:boss?r.boss:names[Math.floor(Math.random()*names.length)],hp,maxHp:hp,atk,boss,burn:0};say(`${boss?'Guardian':'Encounter'}: ${g.enemy.name}.`);screen='play';finish()}
function wander(){g.turn++;const roll=Math.random();if(roll<.45){encounter();return}if(roll<.70){g.wood++;g.metal++;say('You find usable branches and exposed ore: +1 wood, +1 metal.')}else if(roll<.80){if(Math.random()<.5){const rune=WORLD.runes[Math.floor(Math.random()*WORLD.runes.length)];g.runes.push(rune);say(`You uncover a ${rune}. Bind it permanently from Inventory.`)}else{g.cores++;say('An abandoned chest holds 1 weapon core.')}}else if(roll<.85){say('A travelling merchant points you to the village shop.');screen='village'}else say('A peaceful stretch of road. The trees whisper of the old world.');finish()}
function strike(){const w=weapon(),e=g.enemy;let damage=attackStat()+Math.floor(Math.random()*5);if(w.rune==='Flame Rune')e.burn=3;if(w.rune==='Water Rune')damage+=4;if(w.rune==='Nature Rune'){g.hp=Math.min(g.maxHp,g.hp+3);say('Nature restores 3 health.')}e.hp-=damage;say(`You strike for ${damage} damage.`);if(e.hp<=0)win();else enemyTurn();finish()}
function enemyTurn(guard=false){const e=g.enemy;if(!e)return;if(e.burn>0){e.hp-=4;e.burn--;say('Flames deal 4 damage.');if(e.hp<=0){win();return}}let damage=Math.max(1,e.atk-defence()+Math.floor(Math.random()*4));if(guard)damage=Math.ceil(damage/2);g.hp=Math.max(0,g.hp-damage);say(`${e.name} deals ${damage} damage.`);if(!g.hp){store(KEY,null);g=null;screen='play';notice('You fell. Begin a new character; named save slots remain available.')}}
function win(){const boss=g.enemy.boss;g.enemy=null;g.kills++;const xp=boss?50+g.region*8:18+g.region*4, gold=boss?40+g.region*10:10+g.region*3;g.xp+=xp;g.gold+=gold;say(`Victory! +${xp} XP, +${gold} gold.`);if(boss){g.bosses.push(g.region);g.cores++;g.unlocked=Math.min(14,Math.max(g.unlocked,g.region+1));say(g.region===14?'The Dreamscape king falls. Elian: Someone must have reopened the rift. They know about source energy…':'The guardian falls. A new road opens; you gain 1 weapon core.')}else if(g.kills%4===0){g.cores++;say('You recover 1 weapon core.')}while(g.xp>=g.level*35){g.xp-=g.level*35;g.level++;g.maxHp+=12;g.hp=g.maxHp;say(`Level ${g.level}! Health restored; attack and defence grow.`)}}
function finish(){draw();if(g&&$('journal').scrollHeight<900)$('journal').scrollTop=$('journal').scrollHeight}
function drink(){if(!g.potions){notice('You have no potions.');return}if(g.hp===g.maxHp){notice('Your health is already full.');return}g.potions--;g.hp=Math.min(g.maxHp,g.hp+40);say('Healing potion restores up to 40 HP.');if(g.enemy)enemyTurn();finish()}
function inventory(){title('Inventory / Equip');line(`Wood ${g.wood} · Metal ${g.metal} · Cores ${g.cores} · Healing potions ${g.potions}`);button('Drink healing potion',drink,$('choices'),!g.potions);g.weapons.forEach((w,i)=>button(`${i===g.equipped?'Equipped: ':'Equip: '}${w.name} (+${w.atk} ATK)${w.rune?' · '+w.rune:''}`,()=>{g.equipped=i;say(`Equipped ${w.name}.`);finish()},$('choices'),!!g.enemy||i===g.equipped));
 line('Loose runes are consumed when attached. Binding is permanent, one rune per weapon.');for(const r of new Set(g.runes))button(`Bind ${r} to ${weapon().name}`,()=>{if(g.enemy||weapon().rune)return;g.runes.splice(g.runes.indexOf(r),1);weapon().rune=r;say(`${r} permanently bound to ${weapon().name}.`);finish()},$('choices'),!!g.enemy||!!weapon().rune);
}
function town(){title(WORLD.regions[g.region].village);if(g.enemy){line('Finish or escape your fight before entering the village.');button('Return to combat',()=>{screen='play';draw()});return}line('Village: a resting place, shop and one simple blacksmith. Prices are shown before you buy.');
 button('Rest — free',()=>{g.hp=g.maxHp;say('You rest safely at the village. Health restored.');finish()});button('Buy healing potion — 12 gold',()=>{if(g.gold<12)return notice('You need 12 gold.');g.gold-=12;g.potions++;say('Bought 1 healing potion for 12 gold.');finish()},$('choices'),g.gold<12);
 button('Forge sword — 2 metal + 1 wood + 1 core + 30 gold',()=>{if(g.metal<2||!g.wood||!g.cores||g.gold<30)return;g.metal-=2;g.wood--;g.cores--;g.gold-=30;const atk=8+g.region*4;g.weapons.push({name:WORLD.regions[g.region].name+' Sword',atk,rune:null});g.equipped=g.weapons.length-1;say(`Forged and equipped a sword (+${atk} ATK).`);finish()},$('choices'),g.metal<2||!g.wood||!g.cores||g.gold<30||g.weapons.length>=1000);
 button('Talk to Elian',()=>{say(g.bosses.includes(14)?'Elian: Someone opened the rift again. Whoever did it knows source energy. This peace may not last.':'Elian: My grandfather helped stabilise the source. The four surviving civilisations protected their cores. Grow stronger before challenging the Dreamscape king.');finish()});button('Leave village',()=>{screen='play';draw()});
}
function travel(){title('Travel');if(g.enemy){line('Finish the current fight before travelling.');return}WORLD.regions.forEach((r,i)=>button(`${r.name}${g.bosses.includes(i)?' · Guardian defeated':''}`,()=>{g.region=i;say(`You travel to ${r.name}.`);screen='play';finish()},$('choices'),i>g.unlocked||i===g.region))}
function dictionary(){title('Dictionary');line('These rules describe Soules Simple only. Full Soules has its own extensive dictionary.');
 const entries=[['Wandering','One roll: 45% monster, 25% materials, 10% chest, 5% merchant, 15% peaceful. A chest gives either a core or a random loose rune, equally likely.'],['Materials','Gather guarantees 1 wood and 1 metal. Every fourth combat victory also grants a core; guardians grant a core. No village construction in Simple.'],['Combat','Attack, defend, potion or flee (65%, ordinary monsters only). Defence reduces each enemy hit. Levelling fully heals and raises attack, defence and max HP. Enemies strengthen by region and every five player levels.'],['Healing','Village rest is free. A 12-gold potion heals 40 HP and takes a combat turn.'],['Forging','2 metal + 1 wood + 1 core + 30 gold. A sword has +8 ATK, plus 4 per region index. Your Rusty Sword has +3 ATK.'],['Runes','Flame: 4 burn damage for up to three enemy turns; attacking refreshes duration. Water: +4 damage per hit. Earth: +4 defence while equipped. Nature: heals 3 HP per attack. Loose runes are consumed by permanent binding, one rune per weapon. No fusion system in Simple.'],['Easy','Enemy HP is 25% lower and enemy attack is 40% lower. The wander odds stay the same.'],['Guardians','One victory per region. Beating one opens the next region; The Dreaming God ends this edition. No postgame seasons.'],['Saves','Automatic local save plus three manual slots. Export JSON to move progress to another laptop. Full-game saves are separate and incompatible. Death clears only the active autosave.']];
 for(const [h,t]of entries){const b=document.createElement('h3');b.textContent=h;$('detail').append(b);line(t)}
 const h=document.createElement('h3');h.textContent='Regions and guardians';$('detail').append(h);for(const r of WORLD.regions)line(`${r.name}: ${r.boss}. Monsters: ${r.monsters.join(', ')}. Village: ${r.village}.`);
}
function help(){title('Tutorial');for(const text of ['1. Begin in Old Village with a Rusty Sword and no supplies. Talk to Elian, then leave the village.','2. Wander to find monsters, materials and cores. Gather wood & metal when you need guaranteed materials.','3. Choose Attack in a fight; use Defend to reduce one incoming hit. Flee when necessary. Return to the village between fights and rest.','4. Buy potions with battle gold. Once you have a core and materials, ask the blacksmith for a sword. Attach a found rune from Inventory.','5. Challenge the regional guardian when ready. Travel to the next unlocked region. Defeat the Dreamscape king to finish.','6. Save a slot or export before experimenting. Reopen this same HTML file in the same browser to continue automatically. If you move or rename it, import your exported JSON.','This is intentionally small: no village management, raids, companions, commissions, weather simulation, fusion trees, daily rewards or later seasons. The full edition keeps those systems.'])line(text)}
function saves(){title('Saves');line('Only Soules Simple saves work here. Export a backup before moving this file or clearing browser data.');for(let i=1;i<=3;i++){const key=KEY+'-slot-'+i,s=read(key);line(`Slot ${i}: ${s&&typeof s.name==='string'?s.name+' · Level '+s.level:'Empty'}`);button('Save slot '+i,()=>{if(g){store(key,g);draw()}},$('choices'),!g);button('Load slot '+i,()=>{const s=read(key);const restored=valid(s);if(g&&!confirm('Replace the current adventure with this slot?'))return;g=restored;screen='play';draw()},$('choices'),!s)}
 button('Export save',()=>{const a=document.createElement('a');const url=URL.createObjectURL(new Blob([JSON.stringify(g,null,2)],{type:'application/json'}));a.href=url;a.download='soules-simple-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},$('choices'),!g);button('Import save',()=>$('import').click());button('New character',()=>{if(g&&!confirm('Start a new character? Save or export first to keep this adventure.'))return;store(KEY,null);g=null;screen='play';draw()});
}
$('import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>1000000)throw Error('Choose a save smaller than 1 MB.');const restored=valid(JSON.parse(await file.text()));if(g&&!confirm('Replace your active adventure with the imported save?'))return;g=restored;screen='play';draw()}catch(err){notice('Could not import: '+err.message)}finally{e.target.value=''}};
$('theme').value=read(KEY+'-theme')||'region';$('theme').onchange=()=>{store(KEY+'-theme',$('theme').value);draw()};draw();
</script></body></html>
